services:
    db:
        container_name: pondo-postgres
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: ${DB_NAME}
            POSTGRES_USER: ${DB_USER}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
            #tells postgres where data is stored in the container
            PGDATA: /data/postgres
        ports:
            - "5332:5432"
        volumes:
            - db:/data/postgres
        networks:
            - db
        restart: unless-stopped

#if you have more than 1 container and you want them to talk with each other
networks:
    db:
        driver: bridge
volumes:
    db: