spring.application.name=pondo-api

#import env file
spring.config.import=optional:file:.env[.properties]

#postgres info
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5332/${DB_NAME}}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

#hibernate only checks that the tables match your entities. 
#if something’s missing or the wrong type, the app refuses to start with an error. 
#it never changes the database.
spring.jpa.hibernate.ddl-auto=validate

#shows sql in cli when running server
#turn off in production though since it logs all the sql commands and can slow it down
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}
spring.jpa.show-sql=${SHOW_SQL:false}

server.forward-headers-strategy=framework